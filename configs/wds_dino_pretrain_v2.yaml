# DINOv2-style agricultural continual pretraining on rebuilt WebDataset shards.
# Uses official DINOv2 ViT-B/14 initialization, centered teacher targets,
# matching-view iBOT, differentiable KoLeo, and per-step cosine schedules.

data:
  data_root: 'E:\AG_Dataset\shards\dataset-*.tar'
  catalog_path: null
  crop_size: 224
  channels: 3
  batch_size: 8
  epoch_batches: 256000
  num_workers: 12
  prefetch_factor: 4
  val_fraction: 0.02

runtime:
  output_dir: ../runs/wds_dino_pretraining_v2
  epochs: 100
  seed: 42
  precision: bf16
  device: cuda
  warmup_epochs: 10
  gradient_accumulation_steps: 32
  resume: true
  resume_from: null
  initialize_from: null
  log_every: 50
  save_visualizations: true
  visualization_every: 5
  visualization_samples: 8

model:
  model_name: B
  pretrained_backbone: true
  pretrained_source: dinov2
  pretrained_cfg: null
  dino_out_dim: 65536
  dino_hidden_dim: 2048
  dino_bottleneck_dim: 256
  head_nlayers: 3
  num_global_crops: 2
  num_local_crops: 6
  global_crop_scale: [0.4, 1.0]
  local_crop_scale: [0.05, 0.4]
  student_temperature: 0.1
  teacher_temperature_start: 0.04
  teacher_temperature: 0.07
  teacher_temperature_warmup_epochs: 10
  dino_loss_weight: 1.0
  ibot_loss_weight: 1.0
  koleo_loss_weight: 0.1
  teacher_momentum_start: 0.996
  teacher_momentum_end: 1.0
  center_momentum: 0.9
  gradient_checkpointing: true
  drop_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.1

optimizer:
  learning_rate: 0.0005
  min_learning_rate: 0.000001
  weight_decay: 0.04
  weight_decay_end: 0.4
