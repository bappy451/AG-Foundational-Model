data:
  data_root: 'E:\AG_Dataset\01_Evaluation\PlantSeg'
  crop_size: 640
  batch_size: 8
  num_workers: 8
  prefetch_factor: 2

runtime:
  output_dir: 'E:\AG_Dataset\runs\benchmark\det_plantseg_dino'
  epochs: 50
  seed: 42
  precision: bf16
  device: cuda
  warmup_epochs: 3
  gradient_accumulation_steps: 4
  log_every: 10
  grad_clip_norm: 0.1
  early_stopping_patience: 10

model:
  model_name: B
  pretrained_source: dinov3
  pretrained_weights: 'E:\AG_Dataset\AG-Foundational-Model\runs\dinov3_dapt_full_scale\best.pt'
  freeze_backbone_epochs: 5
  layer_decay: 0.75
  drop_rate: 0.0
  attn_drop_rate: 0.0
  drop_path_rate: 0.1
  num_classes: null
  obb_num_convs: 4
  fpn_out_channels: 256

optimizer:
  learning_rate: 0.0002
  weight_decay: 0.05
