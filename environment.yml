name: ag-foundation

# Reproducible environment for Auburn Easley Tesla T4 nodes.
# PyTorch's CUDA 11.8 runtime is compatible with Easley's CUDA 11.x driver.
channels:
  - pytorch
  - nvidia
  - conda-forge
channel_priority: strict

dependencies:
  - python=3.10.18
  - pip
  - setuptools
  - wheel

  # GPU framework
  - pytorch=2.2.2
  - torchvision=0.17.2
  - torchaudio=2.2.2
  - pytorch-cuda=11.8

  # Core and geospatial packages stay in Conda to avoid source builds.
  - numpy=1.26.4
  - pandas=2.2.3
  - pillow=11.1.0
  - pyyaml=6.0.2
  - rich=13.9.4
  - affine=2.4.0
  - matplotlib=3.10.0
  - rasterio=1.4.3

  - pip:
      - click==8.1.8
      - huggingface-hub==0.36.0
      - kornia==0.8.3
      - safetensors==0.8.0
      - timm==1.0.28
      - tqdm==4.67.1
      - webdataset==0.2.111
      - pytest==8.3.5
      - ruff==0.11.2

