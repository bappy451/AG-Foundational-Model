name: ag-foundation

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.10.18
  - pip
  - setuptools
  - wheel

  - numpy=1.26.4
  - pandas=2.2.3
  - pillow=11.1.0
  - pyyaml=6.0.2
  - rich=13.9.4
  - affine=2.4.0
  - matplotlib=3.10.0
  - rasterio=1.4.3

  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.2.2+cu118
      - torchvision==0.17.2+cu118
      - torchaudio==2.2.2+cu118
      - click==8.1.8
      - huggingface-hub==0.36.0
      - kornia==0.8.2
      - safetensors==0.8.0
      - timm==1.0.28
      - tqdm==4.67.1
      - webdataset==0.2.111
      - pytest==8.3.5
      - ruff==0.11.2

